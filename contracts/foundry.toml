[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "./test/fixtures" }]
remappings = [
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

# The fork tests run on Cancun chains (Base, Arbitrum, Ethereum): KyberSwap's executor uses
# an opcode Shanghai lacks. `FOUNDRY_PROFILE=fork forge test --match-path 'test/fork/*'`.
# The deployed contracts stay compiled for Shanghai (the default profile) (C-05).
[profile.fork]
evm_version = "cancun"

[rpc_endpoints]
base = "${BASE_RPC_URL}"
arbitrum = "${ARBITRUM_RPC_URL}"
mainnet = "${ETH_RPC_URL}"
polygon = "${POLYGON_RPC_URL}"

[lint]
lint_on_build = false
