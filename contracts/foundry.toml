[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [
    { access = "read", path = "./test/fixtures" },
    { access = "read", path = "../canister/golden" },
]
remappings = [
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

# The fork tests run on Cancun chains (Base, Arbitrum, Ethereum): KyberSwap's executor uses
# an opcode Shanghai lacks. `FOUNDRY_PROFILE=fork forge test --match-path 'test/fork/*'`.
# The deployed contracts stay compiled for Shanghai (the default profile) (C-05).
[profile.fork]
evm_version = "cancun"

[rpc_endpoints]
base = "${BASE_RPC_URL}"
arbitrum = "${ARBITRUM_RPC_URL}"
mainnet = "${ETH_RPC_URL}"
polygon = "${POLYGON_RPC_URL}"
# the chains added on 2026-10-19, each named as the staging kit's chain key and rpc variable
optimism = "${OPTIMISM_RPC_URL}"
unichain = "${UNICHAIN_RPC_URL}"
monad = "${MONAD_RPC_URL}"
hyperevm = "${HYPEREVM_RPC_URL}"
worldchain = "${WORLDCHAIN_RPC_URL}"
plasma = "${PLASMA_RPC_URL}"
# the chains added on 2026-11-08
avalanche = "${AVALANCHE_RPC_URL}"
arc = "${ARC_RPC_URL}"
# BNB Chain, added 2026-11-08 (no CCTP: its receiver is inert)
bsc = "${BSC_RPC_URL}"

[lint]
lint_on_build = false
