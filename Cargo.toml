[workspace]
members = [
    "canister/api",
    "canister/impl",
    "canister/integration_tests",
    "canister/stub_minter",
    "canister/stub_pool",
    "canister/types",
]
resolver = "2"

[workspace.dependencies]
# one alloy release train, pinned together: primitives and sol-types share their
# encoding, and a mixed pair encodes a different call
alloy-primitives = { version = "1.7", default-features = false, features = ["std"] }
alloy-rlp = { version = "0.3", default-features = false }
alloy-sol-types = { version = "1.7", default-features = false, features = ["std"] }
candid = "0.10"
ethnum = "1.5"
# join_all: several canister calls awaited at once; in the build already through
# ic-cdk-timers
futures = { version = "0.3", default-features = false, features = ["alloc"] }
hex = "0.4"
ic-cdk = "0.17"
ic-cdk-timers = "0.11"
ic-stable-structures = "0.6"
# the canister's key recovery: ECDSA only, without the precomputed tables, so the wasm
# carries the curve and not a table of it
k256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
# signing in tests only, as a payer would
libsecp256k1 = { version = "0.7", default-features = false, features = ["static-context"] }
minicbor = { version = "2", features = ["alloc", "derive"] }
num-bigint = "0.4"
pocket-ic = "9"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[profile.release]
lto = true
opt-level = "z"
