[workspace]
members = [
    "backend/canisters/settlement/api",
    "backend/canisters/settlement/impl",
    "backend/integration_tests",
    "backend/libraries/types",
]
resolver = "2"

[workspace.dependencies]
# one alloy release train, pinned together: primitives and sol-types share their
# encoding, and a mixed pair encodes a different call
alloy-primitives = { version = "1.7", default-features = false, features = ["std"] }
alloy-rlp = { version = "0.3", default-features = false }
alloy-sol-types = { version = "1.7", default-features = false, features = ["std"] }
candid = "0.10"
ethnum = "1.5"
hex = "0.4"
ic-cdk = "0.17"
ic-cdk-timers = "0.11"
ic-stable-structures = "0.6"
# pure Rust secp256k1, as the owner's evm-minter uses it on wasm32: no hmac, because
# nothing here signs locally, only recovers
libsecp256k1 = { version = "0.7", default-features = false, features = ["static-context"] }
minicbor = { version = "2", features = ["alloc", "derive"] }
num-bigint = "0.4"
pocket-ic = "9"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[profile.release]
lto = true
opt-level = "z"
