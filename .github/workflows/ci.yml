name: ci

# Every pull request and every push to main: the canister's tests, its reproducible build
# (the "settlement-wasm" artifact: the wasm, its sha256, its candid and the commit), the
# pocket-ic integration tests, and the contracts' tests. Nothing deploys from here: the
# canister is upgraded from Jeff's Mac (the backend's staging/upgrade-canister.sh fetches this
# artifact and holds it to the Mac's own build of the same commit), the contracts by hand.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  # pinned like the compiler: another ic-wasm may shrink to other bytes
  IC_WASM_VERSION: "0.9.10"
  IC_WASM_SHA256: 54f7a100273b2cfbb993b4de1358523c453936d6f80b0cb340ec35e6fd0b5703

jobs:
  canister:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # every action is pinned by commit, with the tag it was read from beside it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rust-toolchain.toml pins the compiler (1.98.1), the wasm target and the components
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # DFINITY's release binary for x86_64 Linux, held to the sha256 GitHub records for it
      # (building it from source compiles binaryen: minutes, for the same tool)
      - name: ic-wasm ${{ env.IC_WASM_VERSION }}
        run: |
          curl -sSfL -o "$RUNNER_TEMP/ic-wasm.tar.xz" \
            "https://github.com/dfinity/ic-wasm/releases/download/$IC_WASM_VERSION/ic-wasm-x86_64-unknown-linux-gnu.tar.xz"
          echo "$IC_WASM_SHA256  $RUNNER_TEMP/ic-wasm.tar.xz" | sha256sum -c --quiet
          tar -xJf "$RUNNER_TEMP/ic-wasm.tar.xz" -C "$RUNNER_TEMP"
          install -m 755 "$RUNNER_TEMP/ic-wasm-x86_64-unknown-linux-gnu/ic-wasm" "$HOME/.cargo/bin/ic-wasm"
          ic-wasm --version
      # rustfmt is not checked yet: the canister's code at c92bd0f is not rustfmt clean, and
      # formatting it moves the panic locations the wasm carries, so it waits for the next
      # canister change (then: cargo fmt --check here)
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked -p types -p settlement_api -p settlement
      - name: The reproducible build
        run: |
          scripts/build-canister.sh settlement
          mkdir -p settlement-wasm
          cp canister/target/wasm32-unknown-unknown/release/settlement.wasm canister/api/can.did settlement-wasm/
          (cd settlement-wasm && sha256sum settlement.wasm > settlement.wasm.sha256)
          {
            echo "COMMIT=$GITHUB_SHA"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "RUSTC=$(rustc -V)"
            echo "IC_WASM=$(ic-wasm --version)"
            echo "SHA256=$(cut -d' ' -f1 settlement-wasm/settlement.wasm.sha256)"
            echo "BYTES=$(stat -c %s settlement-wasm/settlement.wasm)"
          } > settlement-wasm/BUILD
          cat settlement-wasm/BUILD
          echo "settlement.wasm: $(cut -d' ' -f1 settlement-wasm/settlement.wasm.sha256)" >> "$GITHUB_STEP_SUMMARY"
      # the committed did must match the production wasm, which also proves the inttest door
      # never reaches the public interface (extractor output is version dependent: pinned)
      - name: The candid matches the wasm
        run: |
          if ! command -v candid-extractor > /dev/null; then
            cargo install candid-extractor --locked --version 0.1.6
          fi
          scripts/generate-did.sh settlement && git diff --exit-code canister/api/can.did
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: settlement-wasm
          path: settlement-wasm
          # the upgrade script fetches it by commit; a public repository's minutes are free
          retention-days: 90
          if-no-files-found: error

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: integration
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # the integration-test wasm is not shrunk: no ic-wasm here
      - uses: dfinity/setup-dfx@e50c04f104ee4285ec010f10609483cf41e4d365 # main @ 2024-04-01; repo publishes no tags or releases
        with:
          # paired pin: dfx 0.29.2 bundles pocket-ic-server 9.0.3, which must stay on the same
          # major as the pocket-ic crate 9.x of the integration_tests crate. Bump both or neither.
          dfx-version: "0.29.2"
      - run: scripts/run-integration-tests.sh

  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.3.5
      - run: forge fmt --check
      # the fork tests skip themselves without their rpc urls: no secret is given to CI
      - run: forge test -vv
