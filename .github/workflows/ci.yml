name: ci

# Every pull request and every push to main: the canister's tests, its reproducible build on
# the kit's host (the "settlement-wasm" artifact: the wasm, its sha256, its candid and the
# commit), the pocket-ic integration tests, and the contracts' tests. Nothing deploys from here: the
# canister is upgraded from Jeff's Mac (the backend's staging/upgrade-canister.sh fetches this
# artifact and holds it to the Mac's own build of the same commit), the contracts by hand.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  # pinned like the compiler: another ic-wasm may shrink to other bytes
  IC_WASM_VERSION: "0.9.10"
  # ic-wasm-aarch64-apple-darwin.tar.xz of that release
  IC_WASM_SHA256: f594fc903518b92edbe528e0ffe3d0d910dae9567a35d14fa178b82e35ab93cc

jobs:
  canister:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # every action is pinned by commit, with the tag it was read from beside it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rust-toolchain.toml pins the compiler (1.98.1), the wasm target and the components
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # rustfmt is not checked yet: the canister's code at c92bd0f is not rustfmt clean, and
      # formatting it moves the panic locations the wasm carries, so it waits for the next
      # canister change (then: cargo fmt --check here)
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked -p types -p settlement_api -p settlement
      # the committed did must match the canister's exported interface, which also proves the
      # inttest door never reaches the public interface
      - run: scripts/generate-did.sh settlement && git diff --exit-code canister/api/can.did

  # The production wasm, built where the kit builds it: an Apple Silicon Mac. The same commit
  # gives other bytes on Linux (cargo's crate hashes take the build host's triple from the
  # proc macros a canister crate uses, and the code is laid out by them), so the wasm the
  # upgrade installs is built on the kit's host here too, and the Mac's own build of the
  # commit must give the same sha256 (staging/upgrade-canister.sh holds them to it).
  wasm:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: wasm
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # DFINITY's release binary for Apple Silicon, held to the sha256 GitHub records for it:
      # it shrinks to the same bytes as one cargo installs (checked on the kit's c92bd0f)
      - name: ic-wasm ${{ env.IC_WASM_VERSION }}
        run: |
          curl -sSfL -o "$RUNNER_TEMP/ic-wasm.tar.xz" \
            "https://github.com/dfinity/ic-wasm/releases/download/$IC_WASM_VERSION/ic-wasm-aarch64-apple-darwin.tar.xz"
          echo "$IC_WASM_SHA256  $RUNNER_TEMP/ic-wasm.tar.xz" | shasum -a 256 -c --quiet
          tar -xJf "$RUNNER_TEMP/ic-wasm.tar.xz" -C "$RUNNER_TEMP"
          install -m 755 "$RUNNER_TEMP/ic-wasm-aarch64-apple-darwin/ic-wasm" "$HOME/.cargo/bin/ic-wasm"
          ic-wasm --version
      - name: The reproducible build
        run: |
          scripts/build-canister.sh settlement
          mkdir -p settlement-wasm
          cp canister/target/wasm32-unknown-unknown/release/settlement.wasm canister/api/can.did settlement-wasm/
          (cd settlement-wasm && shasum -a 256 settlement.wasm > settlement.wasm.sha256)
          {
            echo "COMMIT=$GITHUB_SHA"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "RUSTC=$(rustc -V)"
            echo "HOST=$(rustc -vV | sed -n 's/^host: //p')"
            echo "IC_WASM=$(ic-wasm --version)"
            echo "SHA256=$(cut -d' ' -f1 settlement-wasm/settlement.wasm.sha256)"
            echo "BYTES=$(stat -f %z settlement-wasm/settlement.wasm)"
          } > settlement-wasm/BUILD
          cat settlement-wasm/BUILD
          echo "settlement.wasm: $(cut -d' ' -f1 settlement-wasm/settlement.wasm.sha256)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: settlement-wasm
          path: settlement-wasm
          # the upgrade script fetches it by commit; a public repository's minutes are free
          retention-days: 90
          if-no-files-found: error

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: integration
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # the integration-test wasm is not shrunk: no ic-wasm here
      - uses: dfinity/setup-dfx@e50c04f104ee4285ec010f10609483cf41e4d365 # main @ 2024-04-01; repo publishes no tags or releases
        with:
          # paired pin: dfx 0.29.2 bundles pocket-ic-server 9.0.3, which must stay on the same
          # major as the pocket-ic crate 9.x of the integration_tests crate. Bump both or neither.
          dfx-version: "0.29.2"
      - run: scripts/run-integration-tests.sh

  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.3.5
      # no forge fmt check: the contracts are deployed and verified, and a reformatted source
      # moves the metadata hash and breaks verifying the next deploy
      # the fork tests skip themselves without their rpc urls: no secret is given to CI
      - run: forge test -vv
