[package]
name = "settlement"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[features]
inttest = []
# the candid interface exported from the wasm (`get_candid_pointer`); the tests export it
# anyway, the production build does not
export-candid = []

[dependencies]
settlement_api = { path = "../api" }
types = { path = "../types" }

alloy-primitives = { workspace = true }

candid = { workspace = true }
hex = { workspace = true }
ic-cdk = { workspace = true }
ic-cdk-timers = { workspace = true }
ic-stable-structures = { workspace = true }
k256 = { workspace = true }
minicbor = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
alloy-sol-types = { workspace = true }
# signing, for tests that sign as a payer; the canister itself only recovers
libsecp256k1 = { workspace = true, features = ["hmac"] }
